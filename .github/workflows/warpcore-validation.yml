name: Warpcore isolated validation
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'integration-tests/**'
      - 'timer_tests/**'
      - 'review_tests/**'
      - 'tools/prepare_review.mjs'
      - 'tools/supabase_timer.py'
      - '.github/workflows/warpcore-timer.yml'
      - 'docs/warpcore-*.sql'
      - '.github/workflows/warpcore-validation.yml'
permissions:
  contents: read
jobs:
  postgres-concurrency:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: warpcore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgrest:
        image: postgrest/postgrest:v12.2.3
        env:
          PGRST_DB_URI: postgres://postgres:disposable-ci-only@postgres:5432/warpcore_test
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: disposable-ci-jwt-secret-never-production-2026
        ports:
          - '127.0.0.1:3000:3000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated test dependencies
        run: npm ci --prefix integration-tests --ignore-scripts --no-audit --no-fund
      - name: Install pinned feed parser
        run: npm ci --prefix supabase/functions --ignore-scripts --no-audit --no-fund
      - name: Unit and mock transport tests (no external API calls)
        run: node --test supabase/functions/{_shared,news-collect,news-publish,news-operator,news-curate,bluesky-collect}/*.test.mjs review_tests/*.test.mjs
      - name: Credential-free timer tests
        run: python3 -m unittest discover -s timer_tests -v
      - name: Embedded SQL integration
        run: npm test --prefix integration-tests
      - name: Real PostgreSQL overlapping transactions
        env:
          WARPCORE_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/warpcore_test
        run: npm run test:concurrency --prefix integration-tests
      - name: Different-story publication hour contention
        env:
          WARPCORE_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/warpcore_test
        run: npm run test:hour-concurrency --prefix integration-tests
      - name: Real PostgREST API integration (disposable service only)
        env:
          WARPCORE_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/warpcore_test
          WARPCORE_TEST_JWT_SECRET: disposable-ci-jwt-secret-never-production-2026
        run: npm run test:postgrest --prefix integration-tests
      - name: Dot curator PostgREST bridge (no publishing)
        env:
          WARPCORE_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/warpcore_test
          WARPCORE_TEST_JWT_SECRET: disposable-ci-jwt-secret-never-production-2026
        run: npm run test:curator-postgrest --prefix integration-tests
      - name: Dot curator overlapping leases and evidence
        env:
          WARPCORE_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/warpcore_test
        run: npm run test:curator-concurrency --prefix integration-tests
      - name: Bounded multi-story publication contention
        env:
          WARPCORE_TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/warpcore_test
        run: npm run test:batch-concurrency --prefix integration-tests
