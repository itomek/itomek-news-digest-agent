[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-digest-agent"
version = "0.1.0"
description = "A GAIA-based agent that produces personalized news digests from curated sources using local LLM inference."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Tomasz Kowalczyk", email = "heaters-nays0p@icloud.com" },
]

dependencies = [
    # amd-gaia 0.17.2 (commit 2026-04-17); migration to PyPI ==0.17.5 + hashes deferred (see docs/gaia-audit.md §2.2.c).
    "amd-gaia @ git+https://github.com/amd/gaia.git@da5ba458dc1b147927e4c1e8b7c40c473e0da41e",
    "httpx>=0.27.0",
    "feedparser>=6.0.10,<7.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "trafilatura>=1.12.0",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10.0,<4.0.0",
    "pypdf>=4.0,<6.0",
    "supabase>=2.0,<3.0",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.15",
    "mypy>=1.8",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["news_digest"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: tests that require Lemonade Server or Supabase",
]
