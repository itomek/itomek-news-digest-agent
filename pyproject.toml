[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "news-digest-agent"
version = "0.1.0"
description = "A GAIA-based agent that produces personalized news digests from curated sources using local LLM inference."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Tomasz Kowalczyk", email = "heaters-nays0p@icloud.com" },
]

dependencies = [
    "amd-gaia @ git+https://github.com/amd/gaia.git@main",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: tests that require Lemonade Server or Supabase",
]
