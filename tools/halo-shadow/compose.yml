services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: warpcore_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?private environment required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d warpcore_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    cpus: 2
    mem_limit: 1g
  postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/warpcore_test
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?private environment required}
      PGRST_DB_SCHEMAS: public
    depends_on:
      postgres: {condition: service_healthy}
    networks: [isolated]
    cpus: 1
    mem_limit: 256m
  edge:
    image: denoland/deno:2.5.6
    working_dir: /code
    command:
      - run
      - --no-prompt
      - --allow-net=0.0.0.0:8000,postgrest:3000
      - --allow-env=JWT_SECRET,WARPCORE_AGENT_PRODUCER_TOKEN,HALO_SHADOW_ENABLED,HALO_SHADOW_LEASE_SECONDS
      - tools/halo-shadow/index.ts
    environment:
      JWT_SECRET: ${JWT_SECRET}
      WARPCORE_AGENT_PRODUCER_TOKEN: ${WARPCORE_AGENT_PRODUCER_TOKEN:?private environment required}
      DENO_DIR: /tmp/deno-cache
      HALO_SHADOW_ENABLED: 'true'
      HALO_SHADOW_LEASE_SECONDS: '10'
    volumes:
      - ../../:/code:ro
    ports: ['127.0.0.1:58089:8000']
    depends_on: [postgrest]
    networks: [isolated]
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 512m
  exercise:
    image: node:22.23.3-bookworm-slim
    working_dir: /code
    command: [node, tools/halo-shadow/exercise.mjs]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: warpcore_test
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WARPCORE_AGENT_PRODUCER_TOKEN: ${WARPCORE_AGENT_PRODUCER_TOKEN}
      HALO_TEST_INTERVAL_MS: '11000'
    volumes:
      - ../../:/code:ro
      - ${HALO_ARTIFACTS_DIR:?artifact directory required}:/artifacts
    depends_on: [edge]
    networks: [isolated]
    cpus: 2
    mem_limit: 512m
    profiles: [test]
networks:
  isolated: {internal: true}
volumes:
  pgdata:
