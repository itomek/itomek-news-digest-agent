# Self-hosted neural TTS for digest playback (#63).
#
# Kokoro-FastAPI exposes an OpenAI-compatible speech API on port 8880:
#   POST /v1/audio/speech   -> mp3 bytes
#   GET  /v1/audio/voices   -> available voice ids
#
# CPU image: the Strix Halo box is CPU-strong; Kokoro is real-time on it.
# Pinned tag — bump deliberately, never `latest`.
services:
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.5.0
    container_name: kokoro-tts
    restart: unless-stopped
    ports:
      - "8880:8880"
    environment:
      # Default voice the web app requests when the user hasn't picked one.
      - DEFAULT_VOICE=af_heart
